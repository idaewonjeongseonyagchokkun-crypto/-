# main에 푸시할 때마다 Vercel(AI 사진 분석 서버 포함)로 자동 배포합니다.
# 저장소 Secrets에 VERCEL_TOKEN이 있을 때만 실행되고, 없으면 조용히 건너뜁니다.
#   VERCEL_TOKEN       https://vercel.com/account/tokens 에서 만든 토큰
#   ANTHROPIC_API_KEY  https://console.anthropic.com/settings/keys 에서 만든 키 (사진 분석용)
# 배포 주소: https://hankki-scan.vercel.app (이름이 이미 쓰였으면 Vercel이 정한 주소가 실행 기록에 표시됩니다)
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Skip when Vercel is not set up
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::VERCEL_TOKEN 시크릿이 없어 Vercel 배포를 건너뜁니다."
      - if: env.VERCEL_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check token
        if: env.VERCEL_TOKEN != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          t=$(printf '%s' "$VERCEL_TOKEN" | tr -d '[:space:]')
          echo "VERCEL_TOKEN=$t" >> "$GITHUB_ENV"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $t" https://api.vercel.com/v2/user)
          echo "토큰 길이: ${#t}자, Vercel 확인 결과: HTTP $code"
          k=$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '[:space:]')
          case "$k" in
            sk-ant-*) echo "ANTHROPIC_API_KEY: 형식 정상 (길이 ${#k}자)";;
            "") echo "::warning::ANTHROPIC_API_KEY 시크릿이 비어 있습니다.";;
            *) echo "::warning::ANTHROPIC_API_KEY 값이 sk-ant- 로 시작하지 않습니다 (길이 ${#k}자). 키 이름이 아니라 키 값을 넣어 주세요.";;
          esac
          if [ "$code" != "200" ]; then
            echo "::error::VERCEL_TOKEN 값이 올바른 Vercel 토큰이 아닙니다. https://vercel.com/account/tokens 에서 새로 만든 직후 보이는 값을 그대로 넣어 주세요."
            exit 1
          fi
      - name: Link project
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest link --yes --project hankki-scan --token "$VERCEL_TOKEN"
      - name: Set AI key on the project
        if: env.VERCEL_TOKEN != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            npx --yes vercel@latest env rm ANTHROPIC_API_KEY production --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$ANTHROPIC_API_KEY" | npx --yes vercel@latest env add ANTHROPIC_API_KEY production --token "$VERCEL_TOKEN"
          else
            echo "::warning::ANTHROPIC_API_KEY 시크릿이 없어 사진 분석은 예시값으로 동작합니다."
          fi
      - name: Set data sheet address on the project
        if: env.VERCEL_TOKEN != ''
        env:
          INSIGHTS_WEBHOOK_URL: ${{ secrets.INSIGHTS_WEBHOOK_URL }}
        run: |
          w=$(printf '%s' "$INSIGHTS_WEBHOOK_URL" | tr -d '[:space:]')
          case "$w" in
            https://script.google.com/*)
              npx --yes vercel@latest env rm INSIGHTS_WEBHOOK_URL production --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
              printf '%s' "$w" | npx --yes vercel@latest env add INSIGHTS_WEBHOOK_URL production --token "$VERCEL_TOKEN"
              echo "INSIGHTS_WEBHOOK_URL: 형식 정상";;
            "") echo "::notice::INSIGHTS_WEBHOOK_URL 시크릿이 없어 데이터 시트 연결을 건너뜁니다.";;
            *) echo "::warning::INSIGHTS_WEBHOOK_URL 값이 https://script.google.com/ 으로 시작하지 않습니다. Apps Script 웹 앱 URL 전체를 넣어 주세요.";;
          esac
      - name: Set Korean barcode DB key (optional)
        if: env.VERCEL_TOKEN != ''
        env:
          # 이름을 조금 다르게 저장한 경우나 '변수(Variables)' 탭에 저장한 경우도 받아 줍니다.
          FOODSAFETY_API_KEY: ${{ secrets.FOODSAFETY_API_KEY || vars.FOODSAFETY_API_KEY || secrets.FOODSAFETY_KEY || secrets.FOOD_SAFETY_API_KEY || secrets.FOODSAFETYKOREA_API_KEY || secrets.FOODSAFETY_API || secrets.FOODSAFETY_API_KEY_ }}
        run: |
          f=$(printf '%s' "$FOODSAFETY_API_KEY" | tr -d '[:space:]')
          if [ -n "$f" ]; then
            npx --yes vercel@latest env rm FOODSAFETY_API_KEY production --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$f" | npx --yes vercel@latest env add FOODSAFETY_API_KEY production --token "$VERCEL_TOKEN"
            echo "FOODSAFETY_API_KEY: 설정함 (길이 ${#f}자)"
          else
            echo "::notice::FOODSAFETY_API_KEY가 없어 국내 식품안전나라 바코드 조회는 건너뜁니다 (공유 DB·Open Food Facts는 동작)."
          fi
      - name: Connect private data store (once)
        if: env.VERCEL_TOKEN != ''
        run: |
          if npx --yes vercel@latest env ls production --token "$VERCEL_TOKEN" 2>/dev/null | grep -qE 'BLOB_READ_WRITE_TOKEN|BLOB_STORE_ID'; then
            echo "데이터 저장소: 이미 연결됨"
          else
            npx --yes vercel@latest blob create-store hankki-data --access private --region icn1 -e production --yes --token "$VERCEL_TOKEN" \
              && echo "데이터 저장소: 새로 만들어 연결함" \
              || echo "::warning::데이터 저장소를 만들지 못했습니다. 기록은 서버 로그에만 남습니다."
          fi
      - name: Deploy
        if: env.VERCEL_TOKEN != ''
        run: |
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "배포 주소: $url"
          echo "### Vercel 배포 완료: $url" >> "$GITHUB_STEP_SUMMARY"
