# main에 푸시할 때마다 GitHub Pages(https://idaewonjeongseonyagchokkun-crypto.github.io/-/)로 자동 배포합니다.
# Pages에는 서버가 없으므로 AI 사진 분석은 예시값으로 동작합니다. 실제 분석은 Vercel 배포에서 켜집니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # 제품 QR 주소(/p/...)처럼 새로고침한 하위 경로도 앱이 열리도록
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
