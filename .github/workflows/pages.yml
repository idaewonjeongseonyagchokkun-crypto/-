# main에 푸시할 때마다 빌드해서 gh-pages 브랜치로 올립니다.
# GitHub Pages가 gh-pages 브랜치를 서비스하므로 https://idaewonjeongseonyagchokkun-crypto.github.io/-/ 가 자동 갱신됩니다.
# Pages에는 서버가 없으므로 AI 사진 분석은 예시값으로 동작합니다. 실제 분석은 Vercel 배포에서 켜집니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # 제품 QR 주소(/p/...)처럼 새로고침한 하위 경로도 앱이 열리도록
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - name: Push to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "배포: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
